name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Content policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Content policy
        run: python tools/check_policy.py

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -v
      - name: CLI smoke test
        run: |
          set -euo pipefail
          python tools/make_sample.py --out /tmp/sample.nes
          romforge inspect /tmp/sample.nes
          romforge disasm /tmp/sample.nes --mode recursive | head -30
          romforge verify /tmp/sample.nes
          romforge chr /tmp/sample.nes --tiles 4
